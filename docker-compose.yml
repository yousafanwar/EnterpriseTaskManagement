services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: etmp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - etmp-sqlserver-data:/var/opt/mssql

  api:
    image: yousaf007/etmp-api:latest
    container_name: etmp-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EnterpriseTaskManagementDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "EnterpriseTaskManagement"
      Jwt__Audience: "EnterpriseTaskManagementClient"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      - sqlserver

volumes:
  etmp-sqlserver-data: